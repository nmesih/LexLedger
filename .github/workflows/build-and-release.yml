name: Build and Release LexLedger

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and Package for macOS
        run: |
          npx electron-vite build
          npx electron-builder --mac --publish never

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexLedger-macOS
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and Package for Windows
        run: |
          npx electron-vite build
          npx electron-builder --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexLedger-Windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Determine Version and Tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=LexLedger $TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with Installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/LexLedger-macOS/*.dmg
            release-artifacts/LexLedger-Windows/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}